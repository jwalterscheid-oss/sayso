<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="apple-touch-icon" href="/logo.png">
<title>SaySo — Step-by-step walkthrough / Guía paso a paso</title>
<meta name="description" content="How to set up SaySo and get your crew's cards working, in English and Spanish.">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --ink:#1a1a2e; --muted:#6b7280; --line:#e6e8ec;
    --amber:#f5a623; --purple:#635bff; --green:#0f9d58; --red:#c0392b;
    --panel:#fff;
  }
  body{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(160deg,#1b1f27 0%,#13161c 55%,#221c10 100%);
    background-attachment:fixed;color:var(--ink);min-height:100vh;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:1000px;margin:0 auto;padding:28px 16px 60px}

  /* ---------- header ---------- */
  header{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-bottom:22px}
  .brand{font-size:1.6rem;font-weight:800;color:#fff;letter-spacing:-.02em;
    text-shadow:0 2px 12px rgba(0,0,0,.6)}
  .brand i{font-style:normal;color:var(--amber)}
  .tagline{color:#b8bec9;font-size:.9rem;flex:1;min-width:180px}
  .langs{display:flex;background:rgba(255,255,255,.08);border-radius:999px;padding:3px;
    border:1px solid rgba(255,255,255,.14)}
  .langs button{background:none;border:0;color:#cfd4dd;font:inherit;font-size:.85rem;
    font-weight:700;padding:7px 16px;border-radius:999px;cursor:pointer;transition:.18s}
  .langs button[aria-pressed="true"]{background:var(--amber);color:#1b1f27}

  /* ---------- track tabs ---------- */
  .tracks{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
  .tracks button{flex:1;min-width:150px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
    color:#cfd4dd;font:inherit;font-weight:700;font-size:.92rem;padding:13px 14px;border-radius:12px;cursor:pointer;
    text-align:left;line-height:1.35;transition:.18s}
  .tracks button small{display:block;font-weight:500;font-size:.78rem;color:#98a0ad;margin-top:2px}
  .tracks button[aria-pressed="true"]{background:var(--panel);color:var(--ink);border-color:var(--panel)}
  .tracks button[aria-pressed="true"] small{color:var(--muted)}

  /* ---------- stage ---------- */
  .stage{background:var(--panel);border-radius:16px;border-top:4px solid var(--amber);
    box-shadow:0 12px 40px rgba(0,0,0,.35);overflow:hidden}
  .bar{height:4px;background:#eef0f3}
  .bar span{display:block;height:100%;background:var(--amber);width:0;transition:width .45s cubic-bezier(.4,0,.2,1)}
  .grid{display:grid;grid-template-columns:1fr 320px;gap:0}
  @media(max-width:760px){.grid{grid-template-columns:1fr}}
  .copy{padding:30px 30px 24px}
  .step-no{display:inline-flex;align-items:center;gap:8px;font-size:.74rem;font-weight:800;
    letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
  .step-no b{background:var(--amber);color:#1b1f27;width:24px;height:24px;border-radius:12px;
    display:inline-flex;align-items:center;justify-content:center;font-size:.8rem}
  h2{font-size:1.5rem;margin:14px 0 10px;line-height:1.22;letter-spacing:-.01em}
  .lede{font-size:1rem;line-height:1.6;color:#3d4451}
  ul.pts{list-style:none;margin:18px 0 0}
  ul.pts li{position:relative;padding:0 0 0 26px;margin-bottom:11px;font-size:.94rem;line-height:1.55;color:#3d4451}
  ul.pts li::before{content:"";position:absolute;left:6px;top:8px;width:7px;height:7px;
    border-radius:4px;background:var(--amber)}
  .note{margin-top:20px;padding:14px 16px;border-radius:10px;font-size:.88rem;line-height:1.55;
    background:#fff8e8;border:1px solid #f3dfae;color:#6b4e0e}
  .note b{color:#8a5b00}
  .note.warn{background:#fdeeec;border-color:#f3c6c0;color:#8c2f22}
  .note.warn b{color:#8c2f22}

  /* ---------- animated device panel ---------- */
  .viz{background:linear-gradient(170deg,#20242d,#14171d);display:flex;align-items:center;
    justify-content:center;padding:28px 20px;border-left:1px solid #e6e8ec}
  @media(max-width:760px){.viz{border-left:0;border-top:1px solid #e6e8ec;padding:26px 20px}}
  .phone{width:214px;height:404px;border-radius:30px;background:#0d0f14;padding:9px;
    box-shadow:0 18px 44px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.09);position:relative}
  .phone::before{content:"";position:absolute;top:15px;left:50%;transform:translateX(-50%);
    width:56px;height:5px;border-radius:3px;background:#272b33;z-index:3}
  .screen{width:100%;height:100%;border-radius:23px;background:#f4f6f8;overflow:hidden;
    position:relative;display:flex;flex-direction:column}
  .scr-top{background:#fff;padding:22px 13px 10px;font-size:.72rem;font-weight:800;color:#1a1a2e;
    border-bottom:1px solid #edeff2;flex-shrink:0}
  .scr-top i{font-style:normal;color:var(--amber)}
  .scr-body{padding:11px;display:flex;flex-direction:column;gap:8px;flex:1;overflow:hidden}
  .fld{background:#fff;border:1px solid #dfe3e9;border-radius:7px;padding:7px 9px;font-size:.62rem;color:#8b93a1}
  .fld.filled{color:#1a1a2e;font-weight:600;border-color:#c9cfd8}
  .fld.focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(99,91,255,.16)}
  .lbl{font-size:.56rem;font-weight:800;color:#7a828f;text-transform:uppercase;letter-spacing:.06em}
  .btn{background:var(--purple);color:#fff;text-align:center;border-radius:7px;padding:8px;
    font-size:.66rem;font-weight:700}
  .btn.amber{background:var(--amber);color:#1b1f27}
  .btn.ghost{background:#fff;color:var(--purple);border:1px solid #d5d8e6}
  .tile{background:#fff;border-radius:9px;padding:10px}
  .tile .big{font-size:1.32rem;font-weight:800;letter-spacing:-.02em}
  .tile .sm{font-size:.58rem;color:#7a828f;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
  .cardart{background:linear-gradient(125deg,#1f232b,#33261a 78%);border-radius:10px;padding:11px;
    color:#fff;position:relative;overflow:hidden;min-height:66px}
  .cardart::after{content:"";position:absolute;right:-16px;bottom:-22px;width:76px;height:76px;
    border-radius:40px;background:rgba(245,166,35,.19)}
  .cardart .num{font-size:.72rem;letter-spacing:.1em;margin-top:14px;font-weight:600}
  .cardart .nm{font-size:.55rem;opacity:.72;text-transform:uppercase;letter-spacing:.09em}
  .chip{display:inline-block;font-size:.55rem;font-weight:800;padding:2px 7px;border-radius:9px}
  .chip.ok{background:#d1fae5;color:#065f46}
  .chip.bad{background:#fee2e2;color:#991b1b}
  .chip.wait{background:#fef3c7;color:#92400e}
  .row{display:flex;gap:6px;align-items:center}
  .otp{display:flex;gap:5px;justify-content:center;margin-top:4px}
  .otp span{width:22px;height:28px;border:1px solid #d5d9e0;border-radius:5px;background:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.72rem}
  .wallet-hdr{background:#000;color:#fff;padding:9px 11px;font-size:.66rem;font-weight:700;
    display:flex;justify-content:space-between;align-items:center}
  .menu-item{background:#fff;padding:8px 10px;font-size:.63rem;border-bottom:1px solid #eef0f3;
    display:flex;justify-content:space-between;align-items:center;color:#1a1a2e}
  .menu-item.hl{background:#fff6e4;font-weight:700}
  .tap{position:absolute;width:26px;height:26px;border-radius:13px;border:2px solid var(--amber);
    background:rgba(245,166,35,.28);pointer-events:none;opacity:0}
  .fade{animation:fade .5s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  .pulse{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  .tapgo{animation:tapgo 1.9s ease-in-out infinite}
  @keyframes tapgo{0%,58%{opacity:0;transform:scale(.55)}70%{opacity:1;transform:scale(1)}
    86%{opacity:.75;transform:scale(1.5)}100%{opacity:0;transform:scale(1.9)}}

  /* ---------- controls ---------- */
  .ctrls{display:flex;align-items:center;gap:10px;padding:16px 30px 26px;border-top:1px solid var(--line);
    flex-wrap:wrap}
  .ctrls button{font:inherit;font-weight:700;font-size:.88rem;padding:10px 18px;border-radius:9px;
    border:1px solid #d7dbe2;background:#fff;color:var(--ink);cursor:pointer;transition:.15s}
  .ctrls button:hover:not(:disabled){border-color:#b6bcc7}
  .ctrls button.primary{background:var(--purple);border-color:var(--purple);color:#fff}
  .ctrls button:disabled{opacity:.4;cursor:default}
  .dots{display:flex;gap:6px;margin-left:auto}
  .dots i{width:8px;height:8px;border-radius:4px;background:#d7dbe2;cursor:pointer;transition:.2s}
  .dots i.on{background:var(--amber);width:22px}
  .playbtn{margin-left:0}

  /* ---------- footer ---------- */
  .foot{margin-top:22px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .foot a{text-decoration:none}
  .foot .dl{display:inline-block;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);
    color:#e7eaef;font-size:.85rem;font-weight:600;padding:10px 16px;border-radius:9px;transition:.15s}
  .foot .dl:hover{background:rgba(255,255,255,.15)}
  .foot .spacer{flex:1}
  .help{color:#98a0ad;font-size:.82rem}
  .help a{color:var(--amber)}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">Say<i>$</i>o</div>
    <div class="tagline" data-t="tagline"></div>
    <div class="langs" role="group">
      <button id="btn-en" onclick="setLang('en')" aria-pressed="true">English</button>
      <button id="btn-es" onclick="setLang('es')" aria-pressed="false">Español</button>
    </div>
  </header>

  <div class="tracks">
    <button id="tr-owner" onclick="setTrack('owner')" aria-pressed="true">
      <span data-t="trackOwner"></span><small data-t="trackOwnerSub"></small>
    </button>
    <button id="tr-crew" onclick="setTrack('crew')" aria-pressed="false">
      <span data-t="trackCrew"></span><small data-t="trackCrewSub"></small>
    </button>
  </div>

  <div class="stage">
    <div class="bar"><span id="bar"></span></div>
    <div class="grid">
      <div class="copy">
        <div class="step-no"><b id="sNum">1</b><span id="sOf"></span></div>
        <h2 id="sTitle"></h2>
        <p class="lede" id="sLede"></p>
        <ul class="pts" id="sPts"></ul>
        <div class="note" id="sNote" style="display:none"></div>
      </div>
      <div class="viz"><div class="phone"><div class="screen" id="screen"></div></div></div>
    </div>
    <div class="ctrls">
      <button id="prev" onclick="go(-1)" data-t="back"></button>
      <button id="next" class="primary" onclick="go(1)" data-t="next"></button>
      <button id="play" class="playbtn" onclick="togglePlay()"></button>
      <div class="dots" id="dots"></div>
    </div>
  </div>

  <div class="foot">
    <a href="/guides/sayso-owner-guide.pdf" download><span class="dl" data-t="dlOwner"></span></a>
    <a href="/guides/sayso-crew-guide.pdf" download><span class="dl" data-t="dlCrew"></span></a>
    <div class="spacer"></div>
    <div class="help" data-t="help"></div>
  </div>

</div>

<script>
/* ------------------------------------------------------------------ *
 * Content. Every string exists in both languages; the Spanish is the
 * shop-floor register a crew member actually reads, not a literal
 * word-for-word translation of the English.
 * ------------------------------------------------------------------ */
const UI = {
  en: {
    tagline: "Set up your company and get your crew's cards working — step by step.",
    trackOwner: "For the owner", trackOwnerSub: "Set up the company, fund it, add your crew",
    trackCrew: "For the crew", trackCrewSub: "Activate your card and put it on your phone",
    back: "Back", next: "Next", done: "Start over", play: "Play", pause: "Pause",
    of: (a,b) => `Step ${a} of ${b}`,
    dlOwner: "↓ Owner guide (PDF, EN/ES)", dlCrew: "↓ Crew guide (PDF, EN/ES)",
    help: 'Questions? saysosupport@gmail.com'
  },
  es: {
    tagline: "Configura tu empresa y haz que funcionen las tarjetas de tu equipo — paso a paso.",
    trackOwner: "Para el dueño", trackOwnerSub: "Configura la empresa, deposita fondos, agrega al equipo",
    trackCrew: "Para el equipo", trackCrewSub: "Activa tu tarjeta y agrégala al teléfono",
    back: "Atrás", next: "Siguiente", done: "Empezar de nuevo", play: "Reproducir", pause: "Pausa",
    of: (a,b) => `Paso ${a} de ${b}`,
    dlOwner: "↓ Guía del dueño (PDF, EN/ES)", dlCrew: "↓ Guía del equipo (PDF, EN/ES)",
    help: '¿Preguntas? saysosupport@gmail.com'
  }
};

const STEPS = {
  owner: [
    {
      viz: "signup",
      en: { t: "Create your company account",
        l: "Go to saysocard.com and tap <b>Create a free company account</b>. Use your work email. This is the login you will use to run everything.",
        p: ["Use an email you actually check — approval alerts and receipts go there.",
            "Pick a password you can share with whoever else runs the office.",
            "Starting funds are optional. <b>$10 or more</b> sends you straight to Stripe after you tap <b>Create account &amp; set up funding</b>. Leave it blank and fund later."] },
      es: { t: "Crea la cuenta de tu empresa",
        l: "Entra a saysocard.com y toca <b>Create a free company account</b>. Usa tu correo de trabajo. Con ese correo vas a administrar todo.",
        p: ["Usa un correo que revises — ahí llegan las alertas de aprobación y los recibos.",
            "Elige una contraseña que puedas compartir con quien más maneje la oficina.",
            "Los fondos iniciales son opcionales. <b>$10 o más</b> te manda a Stripe después de tocar <b>Create account &amp; set up funding</b>. Déjalo en blanco y deposita después."] }
    },
    {
      viz: "fund",
      en: { t: "Add funds from bank or card",
        l: "In <b>Company wallet</b>, type an amount in <b>Add funds (USD)</b> and tap <b>Add funds from bank or card</b>. That opens Stripe. Pay from your business bank (ACH) or a card.",
        p: ["Minimum is $10.",
            "Card posts right away — use it the first time so you are not waiting.",
            "Bank transfer (ACH) is cheaper but takes a few business days. It shows up automatically once paid.",
            "Stripe sends you back to the console. You will see sign-in again — that is normal. Sign in with the same email and password.",
            "Card money shows as <b>Balance</b>. ACH shows <b>pending (bank payment clearing)</b> until it posts. Sign-in checks for cleared transfers."],
        n: "<b>Plan ahead.</b> A card declines the moment the company wallet is empty, even if the crew card shows a balance. Keep a cushion." },
      es: { t: "Deposita con banco o tarjeta",
        l: "En <b>Company wallet</b>, escribe un monto en <b>Add funds (USD)</b> y toca <b>Add funds from bank or card</b>. Se abre Stripe. Paga desde tu banco de la empresa (ACH) o con tarjeta.",
        p: ["El mínimo es $10.",
            "Con tarjeta el dinero entra de inmediato — úsalo la primera vez para no esperar.",
            "La transferencia (ACH) es más barata pero tarda unos días hábiles. Aparece sola cuando se acredita.",
            "Stripe te regresa a la consola. Vas a ver el inicio de sesión otra vez — es normal. Entra con el mismo correo y contraseña.",
            "Con tarjeta se ve como <b>Balance</b>. ACH se ve como <b>pending (bank payment clearing)</b> hasta que se acredita. Al entrar, el sistema busca transferencias ya pagadas."],
        n: "<b>Planea con tiempo.</b> La tarjeta se rechaza en cuanto la billetera de la empresa queda vacía, aunque la tarjeta del trabajador muestre saldo. Deja un colchón." }
    },
    {
      viz: "merchants",
      en: { t: "Approve the businesses your crew can buy from",
        l: "Add the parts houses, fuel stops and supply shops your crew actually uses. Anything not on the list declines by default.",
        p: ["Card allowlist is the simple option — no bank details needed from the business.",
            "A swipe somewhere not on the list declines once and texts you a one-tap approve link.",
            "Approve it and your hand runs the card again — good for 30 minutes."] },
      es: { t: "Aprueba los negocios donde puede comprar tu equipo",
        l: "Agrega las refaccionarias, gasolineras y proveedores que tu equipo realmente usa. Lo que no esté en la lista se rechaza.",
        p: ["La lista de tarjeta es la opción simple — no necesitas datos bancarios del negocio.",
            "Si pasan la tarjeta en un lugar fuera de la lista, se rechaza una vez y te llega un mensaje con un enlace para aprobar.",
            "Apruebas y tu trabajador vuelve a pasar la tarjeta — válido por 30 minutos."] }
    },
    {
      viz: "addemp",
      en: { t: "Add your crew",
        l: "Add each person with their name and a 4–6 digit PIN. You are not issuing the card here — they activate it themselves in a later step.",
        p: ["The PIN is how they sign in at the wallet page — tell it to them directly.",
            "Copy the share box (name, PIN, saysocard.com/employee) and send it yourself. We do not text it.",
            "You can add funds, disable someone, or remove them at any time. Remove returns leftover balance to the company wallet."] },
      es: { t: "Agrega a tu equipo",
        l: "Agrega a cada persona con su nombre y un PIN de 4 a 6 dígitos. Aquí no estás emitiendo la tarjeta — ellos la activan después.",
        p: ["Con ese PIN entran a la página de la billetera — dáselos en persona.",
            "Copia la caja para compartir (nombre, PIN, saysocard.com/employee) y envíala tú. Nosotros no la mandamos por mensaje.",
            "Puedes agregar fondos, desactivar a alguien o quitarlo cuando quieras. Si lo quitas, el saldo que le quede vuelve a la billetera de la empresa."] }
    },
    {
      viz: "loadmoney",
      en: { t: "Load money onto a person",
        l: "Money in the company wallet does not spend until you put some on a person. Optional <b>Initial funds (USD)</b> at add time comes out of the wallet, not their pocket.",
        p: ["Later, tap <b>Add funds</b> on their row and type an amount.",
            "If the wallet is short, SaySo asks to add money and sends you back to Stripe.",
            "Crew never put their own money on the card."],
        n: "<b>Wallet first.</b> A card can still decline if the company wallet is empty, even if that person’s card shows a balance." },
      es: { t: "Carga dinero a una persona",
        l: "El dinero de la billetera de la empresa no se gasta hasta que se lo pones a alguien. Los <b>Initial funds (USD)</b> opcionales al agregar salen de la billetera, no de su bolsillo.",
        p: ["Después, toca <b>Add funds</b> en su fila y escribe un monto.",
            "Si no alcanza la billetera, SaySo te pide agregar dinero y te manda otra vez a Stripe.",
            "El equipo nunca pone su propio dinero en la tarjeta."],
        n: "<b>Primero la billetera.</b> La tarjeta se puede rechazar si la billetera de la empresa está vacía, aunque la de esa persona muestre saldo." }
    },
    {
      viz: "identity",
      en: { t: "Your crew activate their own cards",
        l: "Send each person to saysocard.com/employee. They sign in with their name and PIN, then enter email, mobile and date of birth, and agree to the <b>Cross River Bank Authorized User Terms</b> and <b>E-sign policy</b>. The card issues on the spot.",
        p: ["Date of birth is not optional — the bank verifies identity against it.",
            "Without it the card stays locked: it declines everywhere and will not add to a phone.",
            "If it still says Locked, they use <b>Finish verifying your identity</b>, enter DOB again, and tap <b>Unlock my card</b>.",
            "Nobody in your office needs to collect this. Each person enters their own."],
        n: "<b>Why it matters.</b> This one field is the most common reason a brand-new card does not work. The wallet page asks for it up front so it does not bite you later." },
      es: { t: "Tu equipo activa sus propias tarjetas",
        l: "Manda a cada persona a saysocard.com/employee. Entran con su nombre y PIN, ponen correo, celular y fecha de nacimiento, y aceptan los <b>Cross River Bank Authorized User Terms</b> y la <b>E-sign policy</b>. La tarjeta se emite al instante.",
        p: ["La fecha de nacimiento no es opcional — el banco verifica la identidad con ella.",
            "Sin ella la tarjeta queda bloqueada: se rechaza en todos lados y no se puede agregar al teléfono.",
            "Si sigue diciendo Locked, usan <b>Finish verifying your identity</b>, ponen la fecha otra vez y tocan <b>Unlock my card</b>.",
            "Nadie en tu oficina tiene que recoger este dato. Cada quien pone el suyo."],
        n: "<b>Por qué importa.</b> Este dato es la razón más común de que una tarjeta nueva no funcione. La página lo pide desde el principio para evitarte el problema." }
    },
    {
      viz: "watch",
      en: { t: "Watch the money",
        l: "The dashboard shows the company wallet, what is loaded on crew cards, how many cards are active, and what has been spent this month.",
        p: ["A card showing <b>Locked</b> means the issuer is still waiting on something — the console tells you exactly what.",
            "Use “Re-check cards with the issuer” after someone finishes verifying.",
            "Disable a person, or remove them to pull their remaining balance back, at any time."] },
      es: { t: "Vigila el dinero",
        l: "El panel muestra la billetera de la empresa, cuánto está cargado en las tarjetas, cuántas tarjetas están activas y lo gastado este mes.",
        p: ["Una tarjeta que dice <b>Locked</b> significa que al banco todavía le falta algo — la consola te dice qué.",
            "Usa “Re-check cards with the issuer” después de que alguien termine de verificarse.",
            "Desactiva a una persona, o quítala para recuperar su saldo, cuando quieras."] }
    }
  ],
  crew: [
    {
      viz: "signin",
      en: { t: "Sign in to your wallet",
        l: "On your phone, go to saysocard.com/employee. Type your name exactly the way your boss entered it, and your PIN.",
        p: ["Your boss gives you the PIN — 4 to 6 digits.",
            "Add the page to your home screen so it is one tap next time.",
            "If your name will not take, ask the office how it is spelled in the system."] },
      es: { t: "Entra a tu billetera",
        l: "En tu teléfono entra a saysocard.com/employee. Escribe tu nombre tal como lo puso tu patrón, y tu PIN.",
        p: ["Tu patrón te da el PIN — de 4 a 6 dígitos.",
            "Agrega la página a la pantalla de inicio para entrar con un toque.",
            "Si no acepta tu nombre, pregunta en la oficina cómo está escrito en el sistema."] }
    },
    {

/* ------------------------------------------------------------------ */
let lang = "en", track = "owner", idx = 0, playing = true, timer = null;

function t(k){ return UI[lang][k]; }

function paintStatic(){
  document.querySelectorAll("[data-t]").forEach(el => {
    const v = UI[lang][el.dataset.t];
    if (typeof v === "string") el.textContent = v;
  });
  document.documentElement.lang = lang;
  document.getElementById("btn-en").setAttribute("aria-pressed", lang === "en");
  document.getElementById("btn-es").setAttribute("aria-pressed", lang === "es");
  document.getElementById("tr-owner").setAttribute("aria-pressed", track === "owner");
  document.getElementById("tr-crew").setAttribute("aria-pressed", track === "crew");
  document.getElementById("play").textContent = playing ? t("pause") : t("play");
}

function paint(){
  const steps = STEPS[track];
  const s = steps[idx], c = s[lang];

  document.getElementById("sNum").textContent = idx + 1;
  document.getElementById("sOf").textContent = UI[lang].of(idx + 1, steps.length);
  document.getElementById("sTitle").textContent = c.t;
  document.getElementById("sLede").innerHTML = c.l;

  const pts = document.getElementById("sPts");
  pts.innerHTML = "";
  (c.p || []).forEach(x => { const li = document.createElement("li"); li.innerHTML = x; pts.appendChild(li); });

  const note = document.getElementById("sNote");
  if (c.n) { note.style.display = "block"; note.innerHTML = c.n; note.className = "note" + (/not work|no sirve|no funciona|nunca es culpa/.test(c.n) ? " warn" : ""); }
  else note.style.display = "none";

  const scr = document.getElementById("screen");
  scr.innerHTML = (VIZ[s.viz] || (() => ""))();
  scr.classList.remove("fade"); void scr.offsetWidth; scr.classList.add("fade");

  document.getElementById("bar").style.width = ((idx + 1) / steps.length * 100) + "%";
  document.getElementById("prev").disabled = idx === 0;
  document.getElementById("next").textContent = idx === steps.length - 1 ? t("done") : t("next");

  const dots = document.getElementById("dots");
  dots.innerHTML = "";
  steps.forEach((_, i) => {
    const d = document.createElement("i");
    if (i === idx) d.className = "on";
    d.onclick = () => { idx = i; stop(); paint(); };
    dots.appendChild(d);
  });
}

function go(n){
  const steps = STEPS[track];
  idx = (idx + n + steps.length) % steps.length;
  paint();
}
function tick(){ if (playing) go(1); }
function start(){ stop(); timer = setInterval(tick, 7000); playing = true; paintStatic(); }
function stop(){ if (timer) clearInterval(timer); timer = null; playing = false; paintStatic(); }
function togglePlay(){ playing ? stop() : start(); }

function setLang(l){ lang = l; try { localStorage } catch(e){} paintStatic(); paint(); }
function setTrack(tr){ track = tr; idx = 0; paintStatic(); paint(); }

document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") { stop(); go(1); }
  if (e.key === "ArrowLeft") { stop(); go(-1); }
});

// Default to the crew track when someone arrives from the wallet page.
if (location.hash === "#crew" || /employee/.test(document.referrer)) track = "crew";
// Default to Spanish if the browser is set to Spanish.
if ((navigator.language || "").toLowerCase().startsWith("es")) lang = "es";

paintStatic(); paint(); start();
</script>
